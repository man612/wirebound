name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }

      - name: Verify source
        run: |
          npm run lint -- --no-cache
          npm run typecheck
          npm test

      - name: Build Windows installer
        run: npm run build:win

      - name: Generate release checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem 'dist\*.exe'
          if (-not $installers) { throw 'No Windows installer was produced.' }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content 'dist\SHA256SUMS.txt'

      - name: Publish installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            (Get-ChildItem 'dist\*.exe' | ForEach-Object { $_.FullName })
            (Resolve-Path 'dist\SHA256SUMS.txt').Path
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          }
          else {
            gh release create $tag @assets --verify-tag --generate-notes --title $tag
          }
