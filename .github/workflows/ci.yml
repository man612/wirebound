name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata consistency
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($packageVersion -ne $lock.version -or $packageVersion -ne $lock.packages[''].version) {
            throw "package.json version $packageVersion differs from package-lock.json version."
          }

      - name: Verify runtime-watch pin parser
        run: pwsh -NoProfile -File scripts/test-runtime-watch-pins.ps1

      - name: Prepare pinned runtime
        run: npm run runtime:prepare

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Package smoke test
        run: npx electron-builder --win --dir

      - name: Report packaged size and locale set
        shell: pwsh
        run: |
          $root = 'dist\win-unpacked'
          if (-not (Test-Path $root)) { throw 'Packaged app directory was not produced.' }

          $bytes = (Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum
          $sizeMb = [math]::Round($bytes / 1MB, 2)
          $locales = Get-ChildItem (Join-Path $root 'locales') -Filter '*.pak' | Select-Object -ExpandProperty Name

          "### Windows package footprint" >> $env:GITHUB_STEP_SUMMARY
          "- Unpacked size: **$sizeMb MB**" >> $env:GITHUB_STEP_SUMMARY
          "- Electron locales: **$($locales -join ', ')**" >> $env:GITHUB_STEP_SUMMARY

          $unexpected = $locales | Where-Object { $_ -notin @('en-US.pak', 'id.pak') }
          if ($unexpected) {
            throw "Unexpected Electron locales were packaged: $($unexpected -join ', ')"
          }

      - name: Upload QA Windows unpacked app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr63-win-unpacked
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
