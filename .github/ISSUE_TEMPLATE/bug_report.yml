name: Bug report
description: Report something that is not working as expected.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Wirebound. Please include enough detail to reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Wirebound shows connected, but the Android device still has no internet.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Connect Android device via USB
        2. Authorize ADB prompt
        3. Click Start
        4. Accept VPN prompt
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: device-status
    attributes:
      label: ADB device status
      options:
        - device
        - unauthorized
        - offline
        - no device detected
        - not sure
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2

  - type: input
    id: android-version
    attributes:
      label: Android device/version
      placeholder: Pixel 7, Android 15

  - type: textarea
    id: logs
    attributes:
      label: Wirebound logs
      description: Paste relevant terminal logs from Wirebound.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for a similar report.
          required: true
        - label: I have tried reconnecting the USB cable and re-authorizing ADB.
          required: false
