[package]
name = "wirebound-tauri-spike"
version = "0.0.1"
description = "Isolated Wirebound Tauri UI-only performance experiment"
authors = ["Wirebound contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "wirebound_tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
